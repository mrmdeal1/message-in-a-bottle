<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vicissitude General Store</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.art{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.hotspot{position:absolute;background:transparent;border:0;cursor:pointer;appearance:none;-webkit-appearance:none}
.hotspot:focus{outline:none}
.left{left:0;top:18%;width:32%;height:72%}
.center{left:32%;top:18%;width:36%;height:72%}
.right{right:0;top:18%;width:32%;height:72%}
.cover{left:38%;top:0;width:24%;height:18%}
</style>
</head>
<body>
<div class="stage">
<img id="storeArt" class="art" alt="Vicissitude General Store">
<button class="hotspot left" aria-label="The V"></button>
<button class="hotspot center" aria-label="Vicissitude Reserve"></button>
<button class="hotspot right" aria-label="VwithaTude"></button>
<button class="hotspot cover" aria-label="Return to cover" onclick="history.back()"></button>
</div>
<script>
(async()=>{const files=['assets/store-original-01.b64','assets/store-original-02.b64'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));document.getElementById('storeArt').src='data:image/jpeg;base64,'+parts.join('').replace(/\s+/g,'');})().catch(e=>{document.body.textContent='Store artwork failed to load';console.error(e);});
</script>
</body>
</html>
